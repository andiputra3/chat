<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Project Manager OS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div style="padding: 1rem 0; border-bottom: 1px solid var(--border-color); margin-bottom: 1rem;">
                <h2 style="font-size: 1.25rem; color: var(--primary-color);">AI PM OS</h2>
                <p style="font-size: 0.75rem; color: var(--text-secondary);">Project Manager</p>
            </div>
            
            <nav>
                <a href="#" class="nav-item active" data-view="dashboard">
                    📊 Dashboard
                </a>
                <a href="#" class="nav-item" data-view="projects">
                    📁 Projects
                </a>
                <a href="#" class="nav-item" data-view="chat">
                    💬 AI Chat
                </a>
                <a href="#" class="nav-item" data-view="factory">
                    🏭 Factory (L2)
                </a>
                <a href="#" class="nav-item" data-view="builder">
                    🔨 Builder (L3)
                </a>
                <a href="#" class="nav-item" data-view="timeline">
                    📅 Timeline
                </a>
                <a href="#" class="nav-item" data-view="notifications">
                    🔔 Notifications
                    <span id="notification-count" class="badge badge-danger" style="margin-left: auto;">0</span>
                </a>
            </nav>
            
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span class="status-dot online"></span>
                    <span style="font-size: 0.875rem;">System Online</span>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <div id="view-content">
                <!-- Dynamic content loaded by JavaScript -->
            </div>
        </main>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
